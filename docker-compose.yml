services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: secretsentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d secretsentinel"]
      interval: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/secretsentinel
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
